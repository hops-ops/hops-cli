# Reconciled once per Cluster from .gitops/local/cluster.
#
# The zitadel chart fullname is `{release}` when the release name already
# contains "zitadel", else `{release}-zitadel`. AuthStack names the Helm
# release `{xr.name}-zitadel`, so XR name `zitadel` becomes Service
# `zitadel-zitadel`. fullnameOverride pins the API Service to `zitadel` in
# ns `auth` → zitadel.auth.svc.cluster.local. Login UI is `{fullname}-login`
# (`zitadel-login`); do not set login.fullnameOverride to the same value.
apiVersion: hops.ops.com.ai/v1alpha1
kind: AuthStack
metadata:
  name: auth
  namespace: default
spec:
  managementPolicies: ["*"]
  clusterName: hops
  helmProviderConfigRef:
    name: default
    kind: ProviderConfig
  kubernetesProviderConfigRef:
    name: default
    kind: ProviderConfig
  namespace: auth
  chartValues:
    fullnameOverride: zitadel
    zitadel:
      configmapConfig:
        ExternalPort: 443
  domain: auth.hops.localhost
  # Keep this local rollout on the already verified chart version.
  version: "9.34.1"
  externalSecure: true
  gateway:
    enabled: true
    parentRef:
      name: platform
      namespace: istio-ingress
      # No sectionName: attach to every listener (HTTPS where it exists).
  # The masterkey and first admin password are generated once and kept in the
  # cluster Vault at `local/zitadel` (never overwritten), then pulled into the
  # `zitadel-masterkey` / `zitadel-admin-password` Secrets. No manual step.
  # Vault's PVC is the durable copy: deleting it on a cluster that still has
  # Zitadel's database loses the key that database is encrypted with.
  externalSecrets:
    enabled: true
    generate: true
    secretStoreName: vault
    secretPath: local/zitadel
    pushCredentials:
      enabled: false
  firstInstance:
    org: hops
    masterkey:
      secretRef:
        name: zitadel-masterkey
  database:
    embedded:
      storage:
        size: 2Gi
        class: psql

# Publish Crossplane-generated credentials to the Cluster SecretStore. Local
# Environments pull only the keys they need with ExternalSecret.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harmony-login-client
  namespace: harmony-auth
spec:
  refreshInterval: 15s
  updatePolicy: Replace
  deletionPolicy: Delete
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: login-client
  data:
    - match:
        secretKey: pat
        remoteRef:
          remoteKey: harmony/local/identity/login-client
          property: ZITADEL_LOGIN_CLIENT_PAT
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harmony-iam-admin
  namespace: harmony-auth
spec:
  refreshInterval: 15s
  updatePolicy: Replace
  deletionPolicy: Delete
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: iam-admin-pat
  data:
    - match:
        secretKey: pat
        remoteRef:
          remoteKey: harmony/local/identity/iam-admin
          property: ZITADEL_MANAGEMENT_PAT
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harmony-smoke-tests
  namespace: default
spec:
  refreshInterval: 15s
  updatePolicy: Replace
  deletionPolicy: Delete
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: harmony-local-smoke-machine
  data:
    - match:
        secretKey: attribute.client_id
        remoteRef:
          remoteKey: harmony/local/identity/smoke-tests
          property: ZITADEL_CLIENT_ID
    - match:
        secretKey: attribute.client_secret
        remoteRef:
          remoteKey: harmony/local/identity/smoke-tests
          property: ZITADEL_CLIENT_SECRET

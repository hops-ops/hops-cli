# Canonical local personas from infrastructure/zitadel/config/local.yaml.
# Password bytes are supplied by the residual harmony-local-human-passwords
# Secret; generated Zitadel user/project IDs are resolved by AuthStack XRs.
apiVersion: auth.hops.ops.com.ai/v1alpha1
kind: HumanUser
metadata:
  name: harmony-local-approved-admin
  namespace: default
  labels:
    app.kubernetes.io/part-of: harmony-local
    auth.hops.ops.com.ai/reference-name: harmony-local-approved-admin
    harmony.gitkb.com/persona: approved-admin
    harmony.gitkb.com/fixture-role: admin
spec:
  orgIdRef: {name: harmony-local, namespace: default}
  userName: admin-local
  firstName: Admin
  lastName: GitKB
  displayName: Zitadel Admin
  email: admin@gitkb.com
  isEmailVerified: true
  initialSkipPasswordChange: true
  initialPasswordSecretRef: {name: harmony-local-human-passwords, key: approved-admin}
  labels:
    harmony.gitkb.com/persona: approved-admin
    harmony.gitkb.com/fixture-role: admin
    harmony.gitkb.com/source: local-zitadel-gitops
  providerConfigRef: {name: default, kind: ClusterProviderConfig}
---
apiVersion: auth.hops.ops.com.ai/v1alpha1
kind: Grant
metadata: {name: harmony-local-approved-admin, namespace: default}
spec:
  userIdRef:
    name: harmony-local-approved-admin
    apiVersion: auth.hops.ops.com.ai/v1alpha1
    kind: HumanUser
  projectIdRef: {name: harmony-local}
  roles: [approved, admin]
  providerConfigRef: {name: default, kind: ClusterProviderConfig}
---

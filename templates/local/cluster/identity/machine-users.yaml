# Shared smoke identity. provider-upjet-zitadel requires its generated orgId;
# setup-local-gitops-secrets.sh supplies that one residual field after Project
# reconciliation. The user, grant, and generated credentials remain GitOps-owned.
apiVersion: user.zitadel.m.crossplane.io/v1alpha1
kind: MachineUser
metadata:
  name: harmony-local-smoke
  namespace: default
  labels:
    app.kubernetes.io/part-of: harmony-local
    auth.hops.ops.com.ai/reference-name: harmony-local-smoke
spec:
  managementPolicies: ["*"]
  forProvider:
    accessTokenType: ACCESS_TOKEN_TYPE_JWT
    description: Harmony local smoke-test and dev-stack service account
    name: smoke-tests
    userName: smoke-tests
    withSecret: true
  writeConnectionSecretToRef:
    name: harmony-local-smoke-machine
  providerConfigRef:
    name: default
    kind: ClusterProviderConfig
---
apiVersion: auth.hops.ops.com.ai/v1alpha1
kind: Grant
metadata:
  name: harmony-local-smoke
  namespace: default
  labels:
    app.kubernetes.io/part-of: harmony-local
spec:
  userIdRef:
    name: harmony-local-smoke
    apiVersion: user.zitadel.m.crossplane.io/v1alpha1
    kind: MachineUser
  projectIdRef:
    name: harmony-local
    apiVersion: project.zitadel.m.crossplane.io/v1alpha1
    kind: Project
  roles: [approved]
  providerConfigRef:
    name: default
    kind: ClusterProviderConfig

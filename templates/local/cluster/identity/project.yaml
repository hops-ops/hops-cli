# Reconciled once per Cluster from .gitops/cluster.
apiVersion: project.zitadel.m.crossplane.io/v1alpha1
kind: Project
metadata:
  name: harmony-local
  namespace: default
  labels:
    app.kubernetes.io/part-of: harmony-local
    auth.hops.ops.com.ai/reference-name: harmony-local
spec:
  managementPolicies: ["*"]
  forProvider:
    name: harmony-local
    projectRoleAssertion: true
    # Self-signups intentionally start without project roles and enter the
    # application waitlist. Requiring a role here rejects the OIDC callback
    # before Harmony can render that state.
    projectRoleCheck: false
    hasProjectCheck: true
  providerConfigRef:
    name: default
    kind: ProviderConfig

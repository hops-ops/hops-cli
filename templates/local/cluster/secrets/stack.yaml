# Platform SecretStack for the Harmony local Cluster.
#
# The Cluster tree installs the released secret-stack Configuration before this
# XR becomes available. The watcher retries as package CRDs converge.
#
# backend=vault + vault.install for local (no AWS PodIdentity required).
#
# Persistence: file storage on a PVC (not server.dev / inmem). postStart
# init+unseal once, stores root token + unseal key on the volume:
#   /vault/data/.hops-init
# K8s auth for ESO is re-applied every start. Seed KV with:
#   export VAULT_TOKEN=$(kubectl -n vault exec vault-0 -- \
#     awk '/^Initial Root Token:/{print $NF}' /vault/data/.hops-init)
#   make dev-gitops-vault-sync
apiVersion: hops.ops.com.ai/v1alpha1
kind: SecretStack
metadata:
  name: external-secrets
  namespace: default
spec:
  clusterName: harmony
  backend: vault
  namespace: external-secrets
  helmProviderConfigRef:
    name: default
  kubernetesProviderConfigRef:
    name: default
  labels:
    team: platform
    hops.ops.com.ai/stack: harmony-local
  secretStore:
    enabled: true
    scope: Cluster
    name: vault
  vault:
    install: true
    namespace: vault
    path: secret
    version: v2
    auth:
      method: kubernetes
      mountPath: kubernetes
      role: external-secrets
    # Merged into official Vault Helm chart (SecretStack composition defaults
    # use server.dev + no PVC; we override for durable local dogfood).
    values:
      server:
        # Local Vault is single-replica and initialized from its persistent
        # volume. Rolling updates make GitOps lifecycle/policy changes take
        # effect without an imperative pod deletion (the chart defaults to
        # OnDelete).
        updateStrategyType: RollingUpdate
        # Leave dev mode — inmem cannot use dataStorage.
        dev:
          enabled: false
        standalone:
          enabled: true
          config: |
            ui = true
            disable_mlock = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "file" {
              path = "/vault/data"
            }
        dataStorage:
          enabled: true
          size: 1Gi
          # omit storageClass → cluster default (kind: local-path)
        postStart:
          - /bin/sh
          - -c
          - |
            # NOTE: do not use bare `set -e` around `vault status` — sealed/uninit
            # returns exit 2 and would abort the hook (killing the container).
            set -u
            export VAULT_ADDR=http://127.0.0.1:8200
            INIT_FILE=/vault/data/.hops-init

            vault_status_rc() {
              vault status >/dev/null 2>&1
              echo $?
            }

            # API is up when status returns 0 (unsealed) or 2 (sealed / not init).
            i=0
            while [ "$i" -lt 90 ]; do
              rc=$(vault_status_rc)
              if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
                break
              fi
              i=$((i + 1))
              sleep 1
            done
            rc=$(vault_status_rc)
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
              echo "vault postStart: API not ready after wait (rc=$rc)" >&2
              exit 1
            fi

            if [ ! -f "$INIT_FILE" ]; then
              echo "vault postStart: initializing (1 share / threshold 1)"
              vault operator init -key-shares=1 -key-threshold=1 >"$INIT_FILE"
              chmod 600 "$INIT_FILE" || true
            fi

            UNSEAL_KEY=$(awk '/Unseal Key 1:/{print $NF}' "$INIT_FILE")
            ROOT_TOKEN=$(awk '/Initial Root Token:/{print $NF}' "$INIT_FILE")
            if [ -z "${UNSEAL_KEY}" ] || [ -z "${ROOT_TOKEN}" ]; then
              echo "vault postStart: failed to parse $INIT_FILE" >&2
              cat "$INIT_FILE" >&2 || true
              exit 1
            fi

            # Unseal when sealed (status exit 2).
            rc=$(vault_status_rc)
            if [ "$rc" -ne 0 ]; then
              vault operator unseal "$UNSEAL_KEY" >/dev/null
            fi
            export VAULT_TOKEN="$ROOT_TOKEN"

            # Non-dev installs do not auto-mount secret/ — enable KV v2 for ESO.
            if ! vault secrets list -format=json 2>/dev/null | grep -q '"secret/"'; then
              vault secrets enable -path=secret kv-v2
            fi

            if ! vault auth list -format=json 2>/dev/null | grep -q '"kubernetes/"'; then
              vault auth enable kubernetes
            fi

            vault write auth/kubernetes/config \
              kubernetes_host="https://kubernetes.default.svc" \
              token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
              kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
              disable_iss_validation=true

            printf '%s\n' \
              'path "secret/data/*" { capabilities = ["create", "read", "update", "delete", "list"] }' \
              'path "secret/metadata/*" { capabilities = ["create", "read", "update", "delete", "list"] }' \
              | vault policy write external-secrets -

            vault write auth/kubernetes/role/external-secrets \
              bound_service_account_names=external-secrets \
              bound_service_account_namespaces=external-secrets \
              policies=external-secrets \
              ttl=24h

            echo "vault postStart: unsealed + kubernetes auth ready (init file $INIT_FILE)"

# Allow the Cluster Vault server SA to call TokenReview (required for kubernetes auth).
# Independent of the Vault pod lifecycle — apply with cluster gitops.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
  labels:
    hops.ops.com.ai/stack: harmony-local
    hops.ops.com.ai/component: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault

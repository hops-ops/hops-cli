# Reconciled once per Cluster from .gitops/cluster.
apiVersion: zitadel.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: zitadel-credentials
      key: credentials
---
apiVersion: zitadel.m.crossplane.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: zitadel-credentials
      key: credentials

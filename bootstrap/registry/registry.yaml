# In-cluster package registry for local source installs.
# TLS is required: Crossplane's package manager always uses HTTPS.
# Cert material lives in Secret hops-local-registry-tls (created by hops).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-pvc
  namespace: crossplane-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Uses the default StorageClass (local-path in colima/k3s).

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: https
          env:
            # registry:2 serves HTTPS when both are set (still on :5000).
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
            - name: tls
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
            # A laptop resuming several local control planes can briefly take
            # seconds to service TLS. Do not turn CPU contention into a
            # destructive registry restart loop.
            timeoutSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 6
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-pvc
        - name: tls
          secret:
            secretName: hops-local-registry-tls
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: crossplane-system
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: https
      port: 5000
      targetPort: 5000
      nodePort: 30500

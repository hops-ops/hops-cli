name: On Version Tagged, Build and Publish Rust Binaries
on:
  push:
    tags:
    - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    uses: unbounded-tech/workflows-rust/.github/workflows/release.yaml@e5544be009fd26ebe62401f3145e93ea49780727 # v2.3.0
    with:
      binary_name: ${{ github.event.repository.name }}
      build_args: "--release --features vendored"

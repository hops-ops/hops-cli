name: On Push to Main, Version and Tag For Release
on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: write

jobs:
  quality:
    uses: unbounded-tech/workflows-rust/.github/workflows/quality.yaml@v2.3.0
    with:
      cargo_incremental: true

  # This uses commit logs and tags from git to determine the next version number and create a tag for the release
  # Some commits such are chore: will not trigger a version bump and tag! This is by design.
  version-and-tag:
    name: Version and Tag
    needs: quality
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@03c9e11b6c0a2b43c95ef210b6efbb83ac2755b2 # v1.22.3
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    with:
      useDeployKey: true
      rust: true
